name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Build frontend Docker image
        run: docker build -t demanage-frontend:ci .

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: demanage
          POSTGRES_PASSWORD: demanage
          POSTGRES_DB: demanage
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready -U demanage -d demanage
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      API_PORT: 8888
      APP_URL: http://localhost:5180
      DATABASE_URL: postgresql://demanage:demanage@localhost:5432/demanage?schema=public
      JWT_SECRET: ci-only-placeholder-secret
      DEMANAGE_CRUD_TEST: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm prisma validate
      - run: pnpm prisma migrate deploy
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Build backend Docker image
        run: docker build -t demanage-backend:ci .
